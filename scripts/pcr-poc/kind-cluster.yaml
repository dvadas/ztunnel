kind: Cluster
apiVersion: kind.x-k8s.io/v1alpha4
name: ztunnel-pcr
nodes:
  - role: control-plane
    image: kindest/node:v1.35.0
    kubeadmConfigPatches:
      # Enable both feature gates we need:
      #   - PodCertificateRequest (KEP-4317, beta in 1.35, default off)
      #   - ConstrainedImpersonation (KEP-5284, alpha in 1.34, default off)
      # And ensure the certificates.k8s.io/v1beta1 API is enabled on
      # the apiserver.
      - |
        kind: ClusterConfiguration
        apiServer:
          extraArgs:
            feature-gates: "PodCertificateRequest=true,ConstrainedImpersonation=true"
            runtime-config: "certificates.k8s.io/v1beta1=true"
        controllerManager:
          extraArgs:
            feature-gates: "PodCertificateRequest=true,ConstrainedImpersonation=true"
        scheduler:
          extraArgs:
            feature-gates: "PodCertificateRequest=true,ConstrainedImpersonation=true"
      - |
        kind: KubeletConfiguration
        featureGates:
          PodCertificateRequest: true
          ConstrainedImpersonation: true
  - role: worker
    image: kindest/node:v1.35.0
    kubeadmConfigPatches:
      - |
        kind: KubeletConfiguration
        featureGates:
          PodCertificateRequest: true
          ConstrainedImpersonation: true
